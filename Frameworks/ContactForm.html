<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
</head>

<body>
    <!-- Navigation -->
    <nav>
        <div>
            <a href="../index.html"><img src="../resources/logo-page.png" alt="Logo" height="40"></a>
            <button type="button" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span></span>
            </button>
            <div id="navbarNav">
                <ul>
                    <li><a href="../index.html?#services">Servicios</a></li>
                    <li><a href="../index.html?#contact">Contáctanos</a></li>
                    <li><a href="../index.html?#clients">Clientes</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section id="contact-me">
        <div>
            <h2>Contáctanos</h2>
            <form action="">
                <div>
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre_completo" placeholder="Nombre completo">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Ingrese su correo">
                </div>
                <div>
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="4" placeholder="Descripción"></textarea>
                </div>
                <div>
                    <button type="submit">Enviar datos</button>
                </div>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div>
            <div>
                <h5>Logo</h5>
                <p>© 2025 Nuestra Empresa.</p>
            </div>
            <div>
                <h5>Síguenos</h5>
                <ul>
                    <li><a href="#">Facebook</a></li>
                    <li><a href="#">Twitter</a></li>
                    <li><a href="#">Instagram</a></li>
                </ul>
            </div>
            <div>
                <h5>Políticas</h5>
                <ul>
                    <li><a href="#">Términos de uso</a></li>
                    <li><a href="#">Política de privacidad</a></li>
                </ul>
            </div>
        </div>
    </footer>
</body>

</html>
